name: Cargo Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run Cargo tests
        run: nix develop --command cargo test --quiet
