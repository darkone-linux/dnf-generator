[package]
name = "dnf-generator"
version = "0.2.1"
edition = "2021"
description = "Darkone NixOS Framework - configuration generator"

# `cargo run` without `--bin` (just generate, doc codegen): the generator, not
# the `darkone` installer.
default-run = "dnf-generator"

[[bin]]
name = "dnf-generator"
path = "src/main.rs"

[[bin]]
name = "darkone"
path = "src/bin/darkone.rs"

[lib]
name = "dnf_generator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_path_to_error = "0.1"
thiserror = "1"
regex = "1"
rnix = "0.11"
rowan = "0.15"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1", features = ["indexmap2"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
cliclack = "0.5.6"

[dev-dependencies]
tempfile = "3"
