[package]
name = "dnf-generator"
version = "0.1.0"
edition = "2021"
description = "Darkone NixOS Framework - configuration generator"

[[bin]]
name = "dnf-generator"
path = "src/main.rs"

[lib]
name = "dnf_generator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_path_to_error = "0.1"
thiserror = "1"
regex = "1"
rnix = "0.11"
rowan = "0.15"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
